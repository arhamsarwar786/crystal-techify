services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crystal_techify
    volumes:
      - crystal_pg:/var/lib/postgresql/data
      - ./prisma/docker-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crystal_techify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crystal_pg:
